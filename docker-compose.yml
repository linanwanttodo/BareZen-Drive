services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barezen}
      POSTGRES_USER: ${POSTGRES_USER:-barezen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barezen} -d ${POSTGRES_DB:-barezen}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    # Pulls the prebuilt image by default; `docker compose build` rebuilds from
    # source when you want to run a local checkout.
    image: ghcr.io/linanwanttodo/barezen-drive:latest
    build: .
    environment:
      SERVER_PORT: "8080"
      JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-barezen}
      DB_USER: ${POSTGRES_USER:-barezen}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_DIR: /data/storage
      # Object storage: set STORAGE_BACKEND=s3 to keep blobs in any S3-compatible
      # bucket (MinIO, R2, COS...). STORAGE_DIR stays required for upload staging.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      # Reverse-proxy trust. Prefer TRUST_PROXY_CIDRS: TRUST_PROXY=true trusts
      # X-Forwarded-For from ANY peer, which hands the auth rate limiter's
      # buckets to anyone who can reach the port (one forged header per request
      # is a fresh bucket). Set the CIDR list to the proxy's own network instead -
      # with the Caddy HTTPS setup here that is the docker bridge range, since
      # the app sees the proxy as 172.x and the header as Caddy's doing. Without
      # it every visitor shares one bucket through the proxy, which is worse than
      # not rate limiting at all. Direct deployments set nothing.
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      # Legacy switch, kept so an existing .env keeps working. Ignored when
      # TRUST_PROXY_CIDRS is set; the server logs a warning if it is true.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Registration is closed by default: the owner account is whoever exists
      # first, so an open default means the first stranger to press register
      # owns the instance. The owner reopens it from the settings screen.
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
      # Connection pool. The defaults are deliberately conservative for a 1C/1G
      # box; the timeout is what turns an exhausted pool into a fast error
      # instead of a silent half-minute stall.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      DB_LEAK_DETECTION_MS: ${DB_LEAK_DETECTION_MS:-0}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./data/storage:/data/storage
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
