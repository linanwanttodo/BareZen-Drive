# Single source of truth for the product version. Bump this one value to
# release: the server, Android, desktop and iOS build configs all read it, and
# the update manifest (update.json) is generated from it.
# Do not set `group` here: the Compose resources package is derived from it, so
# a global group would rename every generated `*.generated.resources` import.
# Modules that need a group (":server") set it in their own build script.
version=0.0.8

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37,37.0