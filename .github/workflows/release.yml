name: Release

# Produces a GitHub Release with downloadable packages. Pushing a v* tag is the
# normal path; workflow_dispatch lets a release be built from a branch before
# the tag exists. Artifacts are attached to the Release itself, so they stay
# downloadable without an Actions login (unlike workflow artifacts, which are
# session-scoped and expire).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to label the release (for example 0.0.2); defaults to the tag or the project version"
        required: false
        type: string

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: ./gradlew :app:androidApp:assembleDebug :app:androidApp:assembleRelease --console=plain
      - name: Stage APKs with stable names
        run: |
          mkdir -p dist
          cp app/androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/BareZen-Drive-android-debug.apk
          cp app/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk dist/BareZen-Drive-android-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build wasm distribution
        run: ./gradlew :app:webApp:wasmJsBrowserDistribution --console=plain
      - name: Zip the distribution
        run: |
          mkdir -p dist
          (cd app/webApp/build/dist/wasmJs/productionExecutable && zip -qr "$GITHUB_WORKSPACE/dist/BareZen-Drive-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/*
          if-no-files-found: error

  server:
    name: Server distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build server distribution with the web bundle embedded
        run: |
          ./gradlew :app:webApp:wasmJsBrowserDistribution --console=plain
          rm -rf server/src/main/resources/web
          mkdir -p server/src/main/resources/web
          cp -r app/webApp/build/dist/wasmJs/productionExecutable/. server/src/main/resources/web/
          ./gradlew :server:installDist --console=plain
      - name: Tar the distribution
        run: |
          mkdir -p dist
          tar -C server/build/install -czf dist/BareZen-Drive-server.tar.gz server
      - uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: dist/*
          if-no-files-found: error

  # Desktop needs the full JVM actual set before the target can be included; the
  # job builds the native package only once that target is enabled, and is a
  # clean skip (no artifact) until then.
  desktop:
    name: Desktop packages (reserved)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package the desktop app when the target is enabled
        run: |
          if ./gradlew :app:desktopApp:tasks --all --console=plain 2>/dev/null | grep -q "packageDeb"; then
            ./gradlew :app:desktopApp:packageDeb --console=plain
            mkdir -p dist
            find app/desktopApp/build/compose/binaries -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} dist/ \;
          else
            echo "Desktop target not enabled; no desktop package produced."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-desktop
          path: dist/*
          if-no-files-found: ignore

  # iOS builds only on macOS and needs both the Apple targets and Apple-published
  # copies of the shared UI libraries; it skips with no artifact until then.
  ios:
    name: iOS app (macOS, reserved)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the iOS simulator app when Apple targets are enabled
        run: |
          if ./gradlew :app:shared:tasks --all --console=plain 2>/dev/null | grep -q "linkDebugFrameworkIosSimulatorArm64"; then
            ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
            xcodebuild -project app/iosApp/iosApp.xcodeproj -scheme iosApp \
              -configuration Release -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/ios-dd \
              CODE_SIGNING_ALLOWED=NO build
            mkdir -p dist
            (cd build/ios-dd/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/dist/BareZen-Drive-ios-simulator.zip" *.app)
          else
            echo "Apple targets not enabled; no iOS app produced."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ios
          path: dist/*
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ android, web, server, desktop, ios ]
    steps:
      - uses: actions/checkout@v4
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(grep -oE 'VERSION = "[^"]+"' core/src/commonMain/kotlin/com/linan/barezen_drive/core/BuildInfo.kt | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"
      - name: List packages
        run: ls -la dist
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: BareZen-Drive v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
